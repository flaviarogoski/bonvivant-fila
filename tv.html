<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TV · Fila Bon Vivant</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="fila.css">
<style>
/* TV: sempre escura (fica bonita na loja e cansa menos a vista) */
:root{--tv-bg:#1b1b1a;--tv-ink:#f3f2ee;--tv-muted:#9c9b95;--tv-line:#383733;--tv-vinho:#b8485a;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--tv-bg);color:var(--tv-ink);cursor:none}
.tv{height:100%;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);}
.esq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:4vh 3vw;position:relative}
.rot{font-family:var(--f-texto);font-weight:900;text-transform:uppercase;letter-spacing:.3em;font-size:3.2vw;color:var(--tv-muted)}
.senha{font-size:31vw;line-height:.9;transition:color .3s}
.ultimas{font-size:2.2vw;color:var(--tv-muted);display:flex;gap:2.5vw;align-items:baseline}
.ultimas b{font-family:var(--f-marca);font-size:3.6vw;color:var(--tv-ink);opacity:.55;font-variant-numeric:tabular-nums}
.dir{border-left:1px solid var(--tv-line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5vh 2.5vw;gap:3vh;text-align:center}
.dir .logo{width:15vw;max-width:260px;filter:invert(1)}
.qrbox{background:#fff;padding:1.2vw;border-radius:1vw;width:min(22vw,40vh);aspect-ratio:1}
.qrbox canvas,.qrbox img{width:100%!important;height:100%!important;display:block}
.qrtxt{font-family:var(--f-marca);font-weight:700;font-size:2vw;line-height:1.25;text-wrap:balance}
.qrsub{font-size:1.25vw;color:var(--tv-muted)}
.hora{font-size:1.6vw;color:var(--tv-muted);font-variant-numeric:tabular-nums}
.flash .senha{animation:flash 1.1s ease-in-out 3}
@keyframes flash{0%,100%{color:var(--tv-ink)}50%{color:var(--tv-vinho)}}
@media (prefers-reduced-motion:reduce){.flash .senha{animation:none;color:var(--tv-vinho)}}
.conexao{position:absolute;bottom:2vh;left:0;right:0;text-align:center;color:#ff8a80;font-size:1.3vw}
.ativar{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;cursor:pointer;z-index:5;text-align:center;padding:24px}
.ativar b{font-family:var(--f-marca);font-size:4vw}
.ativar span{font-size:1.8vw;color:var(--tv-muted)}
.demo{position:fixed;top:0;left:0;right:0}
@media (orientation:portrait){
  .tv{grid-template-columns:1fr;grid-template-rows:minmax(0,1.6fr) minmax(0,1fr)}
  .dir{border-left:0;border-top:1px solid var(--tv-line);flex-direction:row;flex-wrap:wrap;justify-content:center}
  .senha{font-size:48vw}.rot{font-size:6vw}.ultimas{font-size:4vw}.ultimas b{font-size:6vw}
  .qrbox{width:30vw}.qrtxt{font-size:4vw}.qrsub{font-size:2.6vw}.dir .logo,.hora{display:none}
  .ativar b{font-size:7vw}.ativar span{font-size:3.5vw}
}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Modo demonstração</div>
<div class="tv" id="tv">
  <section class="esq">
    <span class="rot">Senha</span>
    <span class="num senha" id="senha">–</span>
    <div class="ultimas" id="ultimas"></div>
    <div class="conexao" id="conexao"></div>
  </section>
  <aside class="dir">
    <img class="logo" src="logo.png" alt="Bon Vivant em casa">
    <div class="qrbox" id="qr" aria-label="QR code para ser avisado no WhatsApp"></div>
    <div>
      <div class="qrtxt">Quer ser avisado no WhatsApp quando a sua vez estiver chegando?</div>
      <div class="qrsub">Aponte a câmera do celular para o código</div>
    </div>
    <div class="hora" id="hora"></div>
  </aside>
</div>
<div class="ativar" id="ativar" role="button" tabindex="0">
  <b>Toque aqui para ligar o som</b>
  <span>Precisa ser feito uma vez sempre que a TV abrir esta tela.</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="fila.js"></script>
<script>
const F = window.FILA, $ = id => document.getElementById(id);
if (F.DEMO) $('demo').hidden = false;
let ultimoChamado = null, audio = null, wake = null;

try{ new QRCode($('qr'), { text: F.urlPublica(), width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); }
catch(e){ $('qr').textContent = 'QR code indisponível (sem internet)'; }

function relogio(){ $('hora').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
relogio(); setInterval(relogio, 15000);

/* som: "plim-plom" + voz falando a senha */
function plim(){
  if (!audio) return;
  const t = audio.currentTime;
  [[880, 0], [660, .35]].forEach(([f, d]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.5, t + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.9);
    o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + 1);
  });
}
function falar(n){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(`Senha ${n}`); u.lang = 'pt-BR'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => /pt[-_]BR/i.test(v.lang)); if (v) u.voice = v;
    setTimeout(() => speechSynthesis.speak(u), 1300);
  }catch(e){}
}
async function ativar(){
  try{ audio = new (window.AudioContext || window.webkitAudioContext)(); await audio.resume(); }catch(e){}
  $('ativar').hidden = true;
  try{ document.documentElement.requestFullscreen && await document.documentElement.requestFullscreen(); }catch(e){}
  manterAcesa();
}
$('ativar').onclick = ativar;
$('ativar').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') ativar(); };

async function manterAcesa(){
  try{ if ('wakeLock' in navigator){ wake = await navigator.wakeLock.request('screen'); } }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && audio) manterAcesa(); });

async function atualizar(){
  let p;
  try{ p = await F.rpc('fila_publico'); $('conexao').textContent = ''; }
  catch(err){ $('conexao').textContent = err.message; return; }
  if (!p) return;
  $('senha').textContent = p.atual;
  $('ultimas').innerHTML = (p.ultimas && p.ultimas.length) ? `Anteriores ${p.ultimas.map(n => `<b>${n}</b>`).join('')}` : '';
  if (ultimoChamado !== null && p.chamado_em !== ultimoChamado){
    const tv = $('tv'); tv.classList.remove('flash'); void tv.offsetWidth; tv.classList.add('flash');
    plim(); falar(p.atual);
  }
  ultimoChamado = p.chamado_em;
}
atualizar(); setInterval(atualizar, 2000);
</script>
</body>
</html>
