<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Balcão · Fila Bon Vivant</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="fila.css">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:44px;height:44px}
@media (prefers-color-scheme:dark){header img,.pin img{filter:invert(1)}}
header h1{font-family:var(--f-marca);font-size:1.3rem;margin:0;flex:1}
header nav{display:flex;gap:8px;flex-wrap:wrap}
.grade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
@media (max-width:760px){.grade{grid-template-columns:minmax(0,1fr)}}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tit{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
.atual{display:flex;flex-direction:column;align-items:center;gap:2px}
.atual .num{font-size:7rem}
.chamar{font-size:1.4rem;padding:22px 18px;width:100%}
.chamar small{font-weight:400;opacity:.75}
.linha{display:flex;gap:8px}
.linha>*{flex:1}
.ultimas{color:var(--muted);text-align:center;font-size:.9rem}
.avisos{display:flex;flex-direction:column;gap:10px}
.aviso{border:2px solid var(--aviso);background:var(--aviso-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.aviso .topo{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.aviso .num{font-size:2rem}
.aviso .quem{font-weight:900;flex:1;min-width:0}
.aviso .msg{font-size:.85rem;color:var(--muted);background:var(--surface);border-radius:8px;padding:8px 10px}
.aviso .acoes{display:flex;gap:8px;flex-wrap:wrap}
.aviso .acoes .b-wa{flex:1;font-size:1.05rem}
.vazio{color:var(--muted);margin:0;font-size:.92rem}
.lista{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .num{font-size:1.6rem}
.item .nome{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .det{font-size:.85rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:900;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p-esp{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.p-avisar{background:var(--aviso-soft);color:var(--aviso)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.x{background:none;border:0;color:var(--muted);padding:6px 8px;font-weight:400}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:900}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px;align-items:end}
.status{font-size:.85rem;color:var(--muted);text-align:center;min-height:1.2em}
.status.ruim{color:var(--erro)}
.pin{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;padding:0 16px;text-align:center}
.pin img{width:110px;align-self:center}
.pin h1{font-family:var(--f-marca);margin:0}
.dica{font-size:.8rem;color:var(--muted)}
kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Modo demonstração: dados só neste navegador. PIN de teste: 123456 · <a href="#" id="zerar">recomeçar demonstração</a></div>

<form class="pin" id="telaPin" hidden>
  <img src="logo.png" alt="Bon Vivant em casa">
  <h1>Balcão</h1>
  <label for="pin">PIN do balcão<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
  <p class="erro" id="pinErro" role="alert"></p>
  <button class="b-principal" type="submit">Entrar</button>
</form>

<div class="wrap" id="app" hidden>
  <header>
    <img src="logo.png" alt="">
    <h1>Fila do balcão</h1>
    <nav>
      <a class="btn b-peq" href="tv.html" target="_blank" rel="noopener">Abrir TV</a>
      <a class="btn b-peq" href="qrcode.html" target="_blank" rel="noopener">Cartaz do QR code</a>
      <button class="b-peq" id="sair" type="button">Sair</button>
    </nav>
  </header>

  <div class="grade">
    <section class="bloco">
      <div class="atual">
        <p class="tit">Chamando agora</p>
        <span class="num" id="atual">–</span>
      </div>
      <button class="b-principal chamar" id="bProx" type="button">Chamar próxima</button>
      <div class="linha">
        <button id="bDeNovo" type="button" title="Toca o aviso na TV de novo">Chamar de novo</button>
        <button id="bVoltar" type="button">Voltar uma</button>
      </div>
      <p class="ultimas" id="ultimas"></p>
      <p class="status" id="status" role="status"></p>
      <p class="dica">Atalho no computador: <kbd>Espaço</kbd> ou <kbd>→</kbd> chama a próxima.</p>
    </section>

    <section class="bloco">
      <div>
        <p class="tit" style="margin-bottom:10px">Avisar agora</p>
        <div class="avisos" id="avisos"></div>
      </div>
      <div>
        <p class="tit" style="margin-bottom:6px">Na fila com WhatsApp</p>
        <div class="lista" id="lista"></div>
      </div>

      <details id="dCad">
        <summary>Cadastrar WhatsApp pelo balcão</summary>
        <form class="form" id="fCad" novalidate>
          <label for="cSenha">Senha<input id="cSenha" inputmode="numeric" maxlength="4"></label>
          <label for="cNome">Nome<input id="cNome" maxlength="40"></label>
          <label for="cTel">Celular com DDD<input id="cTel" type="tel" inputmode="tel" placeholder="(41) 99999-0000"></label>
          <button type="submit">Adicionar</button>
        </form>
        <p class="erro" id="cErro" role="alert"></p>
      </details>

      <details id="dAj">
        <summary>Ajustes</summary>
        <form class="form" id="fAj" novalidate>
          <label for="aAtual">Corrigir número atual<input id="aAtual" inputmode="numeric" maxlength="4"></label>
          <label for="aAviso">Avisar quando faltarem<input id="aAviso" inputmode="numeric" maxlength="2"></label>
          <label for="aMax">Maior número do papel<input id="aMax" inputmode="numeric" maxlength="4"></label>
          <button type="submit">Salvar ajustes</button>
        </form>
        <p class="erro" id="aErro" role="alert"></p>
      </details>
    </section>
  </div>
</div>

<script src="config.js"></script>
<script src="fila.js"></script>
<script>
const F = window.FILA, $ = id => document.getElementById(id);
const PKEY = 'bvfila-pin';
let PIN = null, E = null, ocupado = false, timer = null;

if (F.DEMO){ $('demo').hidden = false; $('zerar').onclick = e => { e.preventDefault(); F.resetDemo(); location.reload(); }; }
try{ PIN = localStorage.getItem(PKEY); }catch(e){}

function mostrarPin(msg){
  clearInterval(timer); $('app').hidden = true; $('telaPin').hidden = false;
  $('pinErro').textContent = msg || ''; $('pin').value = ''; $('pin').focus();
}
$('telaPin').onsubmit = async e => {
  e.preventDefault(); const p = $('pin').value.trim(); if (!p) return;
  try{ E = await F.rpc('fila_balcao', { p_pin: p }); PIN = p; try{ localStorage.setItem(PKEY, p); }catch(e){} iniciar(); }
  catch(err){ $('pinErro').textContent = err.message; }
};
$('sair').onclick = () => { try{ localStorage.removeItem(PKEY); }catch(e){} PIN = null; mostrarPin(); };

function iniciar(){
  $('telaPin').hidden = true; $('app').hidden = false;
  preencherAjustes(); desenhar();
  clearInterval(timer); timer = setInterval(recarregar, 3000);
}

async function chamarRpc(fn, args, statusMsg){
  if (ocupado) return; ocupado = true; setBotoes(true);
  try{
    E = await F.rpc(fn, { p_pin: PIN, ...(args || {}) });
    status(statusMsg || ''); desenhar(); return true;
  }catch(err){
    if (/PIN/.test(err.message)) return mostrarPin(err.message);
    status(err.message, true); throw err;
  }finally{ ocupado = false; setBotoes(false); }
}
async function recarregar(){
  if (ocupado || document.hidden) return;
  try{ E = await F.rpc('fila_balcao', { p_pin: PIN }); status(''); desenhar(); }
  catch(err){ if (/PIN/.test(err.message)) return mostrarPin(err.message); status(err.message, true); }
}
function status(m, ruim){ const el = $('status'); el.textContent = m; el.classList.toggle('ruim', !!ruim); }
function setBotoes(d){ ['bProx','bDeNovo','bVoltar'].forEach(id => $(id).disabled = d); }

function desenhar(){
  if (!E) return;
  const prox = (E.atual + 1) % (E.max_senha + 1);
  $('atual').textContent = E.atual;
  $('bProx').innerHTML = `Chamar próxima <small>(${prox})</small>`;
  $('ultimas').textContent = E.ultimas && E.ultimas.length ? 'Antes: ' + E.ultimas.join(' · ') : '';

  const avisar = E.clientes.filter(c => c.status === 'aguardando' && c.frente <= E.aviso);
  $('avisos').innerHTML = avisar.length ? avisar.map(c => {
    const m = F.msgAviso(c.nome, c.senha, c.frente);
    return `<div class="aviso">
      <div class="topo"><span class="num">${c.senha}</span>
        <span class="quem">${F.esc(c.nome)}</span>
        <span class="det">${c.frente === 0 ? 'é a próxima' : `faltam ${c.frente}`}</span></div>
      <div class="acoes">
        <a class="btn b-wa" target="_blank" rel="noopener" data-avisar="${c.id}" href="${F.linkWhats(c.tel, m)}">Enviar WhatsApp</a>
        <button class="b-peq" data-ja="${c.id}" type="button">Já avisei</button>
      </div>
      <div class="msg">${F.esc(m)}</div>
    </div>`; }).join('')
    : `<p class="vazio">Ninguém para avisar agora. Quem estiver a ${F.pessoas(E.aviso)} da vez aparece aqui.</p>`;

  $('lista').innerHTML = E.clientes.length ? E.clientes.map(c => {
    const pill = c.status === 'avisado' ? '<span class="pill p-ok">Avisado</span>'
      : c.frente <= E.aviso ? '<span class="pill p-avisar">Avisar</span>'
      : `<span class="pill p-esp">${c.frente} na frente</span>`;
    return `<div class="item"><span class="num">${c.senha}</span>
      <div style="min-width:0"><div class="nome">${F.esc(c.nome)}</div>
        <div class="det">${F.fmtTel(c.tel)}${c.origem === 'balcao' ? ' · pelo balcão' : ''}</div></div>
      <div style="display:flex;align-items:center;gap:4px">${pill}<button class="x" data-tirar="${c.id}" type="button" title="Tirar da fila" aria-label="Tirar senha ${c.senha} da fila">✕</button></div>
    </div>`; }).join('')
    : `<p class="vazio">Ninguém cadastrou WhatsApp ainda. As senhas só de papel não aparecem aqui.</p>`;
}

function preencherAjustes(){ if (!E) return; $('aAtual').value = E.atual; $('aAviso').value = E.aviso; $('aMax').value = E.max_senha; }
$('dAj').addEventListener('toggle', preencherAjustes);

$('bProx').onclick = () => chamarRpc('fila_chamar', { p_passos: 1 }).catch(()=>{});
$('bVoltar').onclick = () => chamarRpc('fila_chamar', { p_passos: -1 }, 'Voltou uma senha.').catch(()=>{});
$('bDeNovo').onclick = () => chamarRpc('fila_rechamar', {}, 'Chamado de novo na TV.').catch(()=>{});

document.addEventListener('click', e => {
  const a = e.target.closest('[data-avisar],[data-ja]');
  if (a){ const id = a.dataset.avisar || a.dataset.ja;
    // o link do WhatsApp abre normalmente; aqui só marcamos como avisado
    setTimeout(() => chamarRpc('fila_marcar', { p_id: id, p_status: 'avisado' }).catch(()=>{}), 0); return; }
  const t = e.target.closest('[data-tirar]');
  if (t){
    if (t.dataset.conf !== '1'){ t.dataset.conf = '1'; t.textContent = 'Tirar?'; setTimeout(() => { if (t.isConnected){ t.dataset.conf = ''; t.textContent = '✕'; } }, 3000); return; }
    chamarRpc('fila_marcar', { p_id: t.dataset.tirar, p_status: 'removido' }, 'Tirado da fila.').catch(()=>{});
  }
});

$('fCad').onsubmit = async e => {
  e.preventDefault(); $('cErro').textContent = '';
  try{
    await chamarRpc('fila_cadastrar', { p_senha: parseInt($('cSenha').value, 10), p_nome: $('cNome').value, p_tel: $('cTel').value }, 'Cadastrado.');
    e.target.reset();
  }catch(err){ $('cErro').textContent = err.message; }
};
$('fAj').onsubmit = async e => {
  e.preventDefault(); $('aErro').textContent = '';
  const n = id => { const v = parseInt($(id).value, 10); return isNaN(v) ? null : v; };
  try{ await chamarRpc('fila_ajustar', { p_atual: n('aAtual'), p_aviso: n('aAviso'), p_max: n('aMax') }, 'Ajustes salvos.'); preencherAjustes(); }
  catch(err){ $('aErro').textContent = err.message; }
};

document.addEventListener('keydown', e => {
  if ($('app').hidden || e.target.closest('input,textarea,select,button,a')) return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); $('bProx').click(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && PIN && !$('app').hidden) recarregar(); });

(async () => {
  if (!PIN) return mostrarPin();
  try{ E = await F.rpc('fila_balcao', { p_pin: PIN }); iniciar(); }
  catch(err){ /PIN/.test(err.message) ? mostrarPin(err.message) : (iniciar(), status(err.message, true)); }
})();
</script>
</body>
</html>
